{% extends 'base.html' %}
{% block titulo %}{% if meta %}Editar{% else %}Nova{% endif %} Meta{% endblock %}
{% block page_title %}{% if meta %}Editar{% else %}Nova{% endif %} Meta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card">
            <div class="card-body" style="padding:36px;">
                <form method="POST">
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <input type="text" class="form-control" id="descricao" name="descricao"
                               value="{{ meta.descricao if meta else '' }}" required
                               placeholder="Ex: Vender R$ 1000 em produtos">
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="tipo" class="form-label">Tipo</label>
                            <select class="form-select" id="tipo" name="tipo" onchange="toggleDataFim()">
                                <option value="diaria" {% if meta and meta.tipo == 'diaria' %}selected{% endif %}>Diária</option>
                                <option value="semanal" {% if meta and meta.tipo == 'semanal' %}selected{% endif %}>Semanal</option>
                                <option value="mensal" {% if meta and meta.tipo == 'mensal' %}selected{% endif %}>Mensal</option>
                                <option value="anual" {% if meta and meta.tipo == 'anual' %}selected{% endif %}>Anual</option>
                                <option value="avulsa" {% if meta and meta.tipo == 'avulsa' %}selected{% endif %}>Avulsa</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="categoria" class="form-label">Categoria</label>
                            <select class="form-select" id="categoria" name="categoria">
                                <option value="financeiro" {% if meta and meta.categoria == 'financeiro' %}selected{% endif %}>Financeiro</option>
                                <option value="investimento" {% if meta and meta.categoria == 'investimento' %}selected{% endif %}>Investimento</option>
                                <option value="feira" {% if meta and meta.categoria == 'feira' %}selected{% endif %}>Feira</option>
                                <option value="outro" {% if meta and meta.categoria == 'outro' %}selected{% endif %}>Outro</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="valor_meta" class="form-label">Valor da Meta (R$)</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="valor_meta" name="valor_meta"
                               value="{{ meta.valor_meta if meta else '' }}" placeholder="0,00">
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="data_ini" class="form-label">Data Início</label>
                            <input type="date" class="form-control" id="data_ini" name="data_ini"
                                   value="{{ meta.data_ini.isoformat() if meta else hoje.isoformat() }}" required>
                        </div>
                        <div class="col-md-6" id="divDataFim">
                            <label for="data_fim" class="form-label">Data Fim</label>
                            <input type="date" class="form-control" id="data_fim" name="data_fim"
                                   value="{{ meta.data_fim.isoformat() if meta and meta.tipo != 'diaria' else '' }}">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('metas.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-check-lg"></i> {% if meta %}Salvar{% else %}Criar{% endif %} Meta
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleDataFim() {
    var tipo = document.getElementById('tipo').value;
    var div = document.getElementById('divDataFim');
    div.style.display = (tipo === 'diaria') ? 'none' : '';
}
toggleDataFim();
</script>
{% endblock %}
