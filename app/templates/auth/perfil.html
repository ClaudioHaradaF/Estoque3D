{% extends 'base.html' %}
{% block titulo %}Meu Perfil{% endblock %}
{% block page_title %}Alterar Senha{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="glass-card">
            <div class="card-body" style="padding:36px;">
                <div style="text-align:center;margin-bottom:24px;">
                    <div style="font-size:48px;color:var(--text-muted);"><i class="bi bi-person-circle"></i></div>
                    <div style="font-weight:600;color:var(--text-primary);margin-top:8px;">{{ usuario.email }}</div>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label for="senha_atual" class="form-label">Senha Atual</label>
                        <input type="password" class="form-control" id="senha_atual" name="senha_atual"
                               placeholder="••••••" required>
                    </div>
                    <div class="mb-3">
                        <label for="nova_senha" class="form-label">Nova Senha</label>
                        <input type="password" class="form-control" id="nova_senha" name="nova_senha"
                               placeholder="mínimo 6 caracteres" required minlength="6">
                    </div>
                    <div class="mb-4">
                        <label for="confirmar_senha" class="form-label">Confirmar Nova Senha</label>
                        <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha"
                               placeholder="repita a nova senha" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="bi bi-check-lg"></i> Alterar Senha
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
