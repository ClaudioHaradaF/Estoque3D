<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f0eb">
    <title>Estoque3D — Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="washi-overlay"></div>
    <div class="loading-screen">
        <div class="loading-enso"></div>
    </div>

    <main class="main-content" style="padding-top: 0;">
        <div class="page-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <div class="row justify-content-center" style="margin-top: 80px;">
                <div class="col-md-5">
                    <div style="text-align:center; margin-bottom: 24px;">
                        <div style="display:inline-block; background:rgba(255,255,255,0.9); padding:12px 24px; border-radius:12px;">
                            <img src="{{ url_for('static', filename='img/harborio-logo.png') }}"
                                 alt="Harborio" style="height:60px;">
                        </div>
                        <h4 style="margin-top:16px; font-weight:300; color:var(--text-muted);">Acesso ao Sistema</h4>
                    </div>
                    <div class="glass-card">
                        <div class="card-body" style="padding: 36px;">
                            <form method="POST">
                                <div class="mb-4">
                                    <label for="email" class="form-label">E-mail</label>
                                    <input type="email" class="form-control" id="email" name="email"
                                           placeholder="seu@email.com" required autofocus>
                                </div>
                                <div class="mb-4">
                                    <label for="password" class="form-label">Senha</label>
                                    <input type="password" class="form-control" id="password" name="password"
                                           placeholder="••••••" required>
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg w-100">
                                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
