<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f0eb">
    <title>Offline — Estoque3D</title>
    <link rel="icon" href="/static/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f5f0eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 24px;
            text-align: center;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.15;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #2c2c2c;
            margin-bottom: 8px;
        }
        p {
            font-size: 15px;
            color: #5c5550;
            max-width: 320px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            border: 1.5px solid #BC002D;
            color: #BC002D;
            background: transparent;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #BC002D;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="icon">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#2c2c2c" stroke-width="2">
            <path d="M32 8v24l12 12" stroke-linecap="round"/>
            <circle cx="32" cy="32" r="22" fill="none"/>
        </svg>
    </div>
    <h1>Você está offline</h1>
    <p>Conecte-se à internet para continuar usando o Estoque3D. Os dados em cache ainda estão disponíveis.</p>
    <button class="btn" onclick="window.location.reload()">
        Tentar novamente
    </button>
    <script>
        window.addEventListener('online', function() { window.location.reload(); });
    </script>
</body>
</html>
